<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events - EventEase</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Navigation Header -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-ticket-perforated"></i> EventEase
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <!-- Navigation items will be dynamically updated by updateNavigation() -->
                </ul>
            </div>
        </div>
    </nav>

    <!-- Events Section -->
    <section class="pt-3 pb-5" style="margin-top: 76px;">
        <div class="container">
            <div class="row mb-4">
                <div class="col-12">
                    <h1 class="display-5 fw-bold mb-3">All Events</h1>
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <select id="categoryFilter" class="form-select">
                                <option value="">All Categories</option>
                                <option value="concert">Concerts</option>
                                <option value="sports">Sports</option>
                                <option value="theater">Theater</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <button id="filterBtn" class="btn btn-primary">Filter</button>
                        </div>
                    </div>
                </div>
            </div>
            <div id="eventsContainer" class="row g-4">
                <!-- Events will be loaded dynamically -->
                <div class="col-12 text-center">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading events...</span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-light py-4 mt-5">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <h5><i class="bi bi-ticket-perforated"></i> EventEase</h5>
                    <p class="text-muted">Your trusted platform for event tickets</p>
                </div>
                <div class="col-md-6 text-md-end">
                    <p class="text-muted mb-0">&copy; 2024 EventEase. All rights reserved.</p>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS - Load in order -->
    <script src="js/config.js"></script>
    <script src="js/services/apiService.js"></script>
    <script src="js/services/authService.js"></script>
    <script src="js/services/eventService.js"></script>
    <script src="js/services/ticketService.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/events.js"></script>
    <script src="js/main.js"></script>
    <script>
        // Events page specific functionality
        document.addEventListener('DOMContentLoaded', async function() {
            // Wait a bit for all scripts to load
            await new Promise(resolve => setTimeout(resolve, 100));
            
            const eventService = window.eventService;
            const utils = window.utils;
            
            if (!eventService) {
                console.error('EventService not available');
                const container = document.getElementById('eventsContainer');
                if (container) {
                    container.innerHTML = '<div class="col-12"><p class="text-danger text-center">Service initialization error. Please refresh the page.</p></div>';
                }
                return;
            }

            async function loadEvents(filters = {}) {
                const eventsContainer = document.getElementById('eventsContainer');
                if (!eventsContainer) return;

                try {
                    eventsContainer.innerHTML = '<div class="col-12 text-center"><div class="spinner-border text-primary"></div></div>';
                    const response = await eventService.getEvents({ ...filters, limit: 20 });
                    
                    if (response.success && response.data && response.data.length > 0) {
                        const eventsHTML = response.data.map(event => {
                            const eventDate = utils.formatDate(event.date);
                            const eventTime = utils.formatTime(event.time);
                            const categoryIcon = event.category === 'concert' ? 'bi-music-note-beamed' : 
                                               event.category === 'sports' ? 'bi-trophy' : 'bi-camera-reels';
                            
                            return `
                                <div class="col-md-4 mb-4">
                                    <div class="card event-card h-100">
                                        <div class="card-body">
                                            <div class="text-center mb-3">
                                                <i class="bi ${categoryIcon} event-icon"></i>
                                            </div>
                                            <h5 class="card-title">${event.name}</h5>
                                            <p class="card-text text-muted small">
                                                <i class="bi bi-calendar"></i> ${eventDate}<br>
                                                <i class="bi bi-clock"></i> ${eventTime}<br>
                                                <i class="bi bi-geo-alt"></i> ${event.venue}
                                            </p>
                                            <a href="event-detail.html?id=${event._id}" class="btn btn-primary btn-sm">
                                                View Details
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            `;
                        }).join('');

                        eventsContainer.innerHTML = `<div class="row g-4">${eventsHTML}</div>`;
                    } else {
                        eventsContainer.innerHTML = '<div class="col-12"><p class="text-muted text-center">No events found.</p></div>';
                    }
                } catch (error) {
                    console.error('Error loading events:', error);
                    let errorMessage = 'Error loading events. Please try again later.';
                    if (error.isNetworkError) {
                        errorMessage = 'Unable to connect to server. Please make sure the backend is running on port 5001.';
                    } else if (error.message) {
                        errorMessage = error.message;
                    }
                    eventsContainer.innerHTML = `<div class="col-12"><p class="text-danger text-center">${errorMessage}</p></div>`;
                }
            }

            // Load all events initially
            await loadEvents();

            // Filter button
            const filterBtn = document.getElementById('filterBtn');
            const categoryFilter = document.getElementById('categoryFilter');
            
            if (filterBtn) {
                filterBtn.addEventListener('click', function() {
                    const category = categoryFilter ? categoryFilter.value : '';
                    loadEvents({ category: category || undefined });
                });
            }
        });
    </script>
</body>
</html>
